name: Update station database

on:
  workflow_dispatch:
  push:
    paths:
      - "stations.kml"

permissions:
  contents: write

concurrency:
  group: station-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stations.json from KML
        run: python scripts/update_stations.py

      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations.json index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Update station database"
            git push
          fi
