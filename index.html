<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>優待QUOナビ</title>
<style>
:root{
  --ink:#18222d; --muted:#71808e; --line:#e6eaee; --paper:#fff;
  --bg:#f4f7f6; --green:#0c7658; --green2:#095d47; --soft:#eaf5f1;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);background:
  radial-gradient(circle at 90% 0%,#e7f3ee 0,transparent 32rem),var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:54px 18px 72px}
.hero{margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo{
  width:42px;height:42px;border-radius:13px;background:var(--green);
  color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;
  box-shadow:0 8px 24px rgba(12,118,88,.18)
}
.brandtext{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--green)}
h1{font-size:clamp(30px,7vw,46px);letter-spacing:-.04em;line-height:1.08;margin:0 0 12px}
.sub{color:var(--muted);font-size:15px;line-height:1.75;margin:0;max-width:580px}
.searchbox{
  background:rgba(255,255,255,.88);border:1px solid rgba(218,225,225,.9);
  border-radius:22px;padding:18px;box-shadow:0 14px 40px rgba(31,48,43,.07);
  backdrop-filter:blur(10px)
}
button{
  width:100%;border:0;border-radius:15px;padding:17px 18px;font-size:16px;
  font-weight:800;background:var(--green);color:#fff;cursor:pointer;
  box-shadow:0 8px 20px rgba(12,118,88,.18);transition:.15s transform,.15s background
}
button:hover{background:var(--green2)} button:active{transform:scale(.99)} button:disabled{opacity:.55}
.status{margin:12px 3px 0;color:var(--muted);font-size:12px;line-height:1.6;min-height:19px}
.list{display:grid;gap:10px;margin-top:18px}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;
  box-shadow:0 5px 18px rgba(32,44,40,.045)
}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.rank{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--green);text-transform:uppercase}
.distance{font-size:12px;font-weight:700;color:#596875;background:#f1f4f4;padding:5px 9px;border-radius:999px;white-space:nowrap}
.name{font-size:16px;font-weight:800;line-height:1.5;letter-spacing:-.01em}
.actions{margin-top:14px;display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.actions a{
  text-align:center;text-decoration:none;padding:11px 8px;border-radius:11px;
  font-weight:800;font-size:13px
}
.route{background:var(--green);color:#fff}.map{border:1px solid var(--line);color:var(--ink);background:#fff}
.note{margin:25px 4px 0;padding-top:17px;border-top:1px solid #dfe5e3;font-size:11px;line-height:1.8;color:#89949e}
.count{color:var(--green);font-weight:800}
@media(max-width:520px){
  .wrap{padding:32px 14px 55px}.hero{margin-bottom:20px}.searchbox{padding:14px;border-radius:19px}
  .actions{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="brand"><div class="logo">Q</div><div class="brandtext">YUTAI QUO NAVI</div></div>
    <h1>近くのQUOカード対応GSを探す。</h1>
    <p class="sub">現在地から、QUOカードで支払えるガソリンスタンドを近い順に表示します。</p>
  </header>
  <section class="searchbox">
    <button id="locate">現在地から探す</button>
    <div id="status" class="status">位置情報は検索時の距離計算にのみ使用します。</div>
  </section>
  <section id="list" class="list"></section>
  <div class="note">
    表示距離は現在地から店舗までの直線距離です。実際の走行距離・所要時間とは異なります。
    店舗の閉店やQUOカード取扱変更等が反映されていない場合があります。ご利用前に店舗へご確認ください。
  </div>
</main>
<script>
const btn=document.getElementById('locate'), statusEl=document.getElementById('status'), list=document.getElementById('list');
let stations=[];
fetch('./stations.json').then(r=>{if(!r.ok) throw new Error(); return r.json()}).then(d=>stations=d)
.catch(()=>statusEl.textContent='店舗データの読み込みに失敗しました。');

function distanceKm(a,b,c,d){
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(c-a), dLng=rad(d-b);
  const q=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(q));
}
function fmt(km){return km<1?Math.round(km*1000)+' m':km.toFixed(km<10?1:0)+' km'}
function mapsRoute(lat,lng){
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
}
function mapsPoint(name,lat,lng){
  // 店名を検索語に含め、Google Maps上の正式な店舗スポットを開きやすくする
  const query = encodeURIComponent(`${name} ${lat},${lng}`);
  return `https://www.google.com/maps/search/?api=1&query=${query}`;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

btn.onclick=()=>{
  if(!navigator.geolocation){statusEl.textContent='このブラウザは位置情報取得に対応していません。';return}
  btn.disabled=true; statusEl.textContent='現在地を取得しています…'; list.innerHTML='';
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const nearest=stations.map(s=>({...s,km:distanceKm(lat,lng,s.lat,s.lng)}))
      .sort((a,b)=>a.km-b.km).slice(0,10);
    statusEl.textContent=`近い順に10店舗を表示中 ／ 登録 ${stations.length}地点`;
    list.innerHTML=nearest.map((s,i)=>`
      <article class="card">
        <div class="topline"><div class="rank">NEAREST ${i+1}</div><div class="distance">${fmt(s.km)}</div></div>
        <div class="name">${esc(s.name)}</div>
        <div class="actions">
          <a class="route" target="_blank" rel="noopener" href="${mapsRoute(s.lat,s.lng)}">🚗 経路を見る</a>
          <a class="map" target="_blank" rel="noopener" href="${mapsPoint(s.name,s.lat,s.lng)}">地図で確認</a>
        </div>
      </article>`).join('');
    btn.disabled=false;
  },err=>{
    const msg={1:'位置情報の利用が許可されませんでした。ブラウザの設定をご確認ください。',2:'現在地を取得できませんでした。',3:'位置情報の取得がタイムアウトしました。'}[err.code]||'位置情報を取得できませんでした。';
    statusEl.textContent=msg; btn.disabled=false;
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
};
</script>
</body>
</html>
