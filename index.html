<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>優待QUOナビ</title>
<style>
:root{--fg:#111;--muted:#687078;--line:#e6e8eb;--bg:#f6f7f8;--card:#fff;--accent:#1769e0}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--fg);background:var(--bg)}
.wrap{max-width:760px;margin:auto;padding:24px 16px 60px}
h1{font-size:28px;margin:6px 0}.sub{color:var(--muted);line-height:1.6;margin:0 0 20px}
button{width:100%;border:0;border-radius:14px;padding:16px 18px;font-size:17px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.55}.status{margin:14px 2px;color:var(--muted);font-size:14px;min-height:21px}
.list{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.rank{font-size:13px;color:var(--muted);margin-bottom:5px}.name{font-size:17px;font-weight:750;line-height:1.45}.meta{margin-top:8px;color:#4d555d;font-size:14px}
.actions{margin-top:13px;display:flex;gap:8px}.actions a{flex:1;text-align:center;text-decoration:none;padding:11px 10px;border-radius:11px;font-weight:700;font-size:14px}
.route{background:#111;color:#fff}.map{border:1px solid var(--line);color:#111;background:#fff}
.note{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;line-height:1.65;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <h1>優待QUOナビ</h1>
  <p class="sub">現在地から、QUOカードで支払えるガソリンスタンドを近い順に探します。</p>
  <button id="locate">📍 現在地から探す</button>
  <div id="status" class="status">位置情報は「現在地から探す」を押したときだけ使用します。</div>
  <section id="list" class="list"></section>
  <div class="note">
    距離は現在地から店舗までの直線距離です。道路上の走行距離・所要時間とは異なります。
    店舗情報は掲載データをもとにしており、閉店・取扱変更等が反映されていない場合があります。利用前に店舗へご確認ください。
  </div>
</main>
<script>
const btn=document.getElementById('locate'), statusEl=document.getElementById('status'), list=document.getElementById('list');
let stations=[];
fetch('./stations.json').then(r=>{if(!r.ok) throw new Error(); return r.json()}).then(d=>stations=d)
.catch(()=>statusEl.textContent='店舗データの読み込みに失敗しました。');

function distanceKm(a,b,c,d){
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(c-a), dLng=rad(d-b);
  const q=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(q));
}
function fmt(km){return km<1?Math.round(km*1000)+' m':km.toFixed(km<10?1:0)+' km'}
function mapsRoute(lat,lng){
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
}
function mapsPoint(name,lat,lng){
  // 店名を検索語に含め、Google Maps上の正式な店舗スポットを開きやすくする
  const query = encodeURIComponent(`${name} ${lat},${lng}`);
  return `https://www.google.com/maps/search/?api=1&query=${query}`;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

btn.onclick=()=>{
  if(!navigator.geolocation){statusEl.textContent='このブラウザは位置情報取得に対応していません。';return}
  btn.disabled=true; statusEl.textContent='現在地を取得しています…'; list.innerHTML='';
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const nearest=stations.map(s=>({...s,km:distanceKm(lat,lng,s.lat,s.lng)}))
      .sort((a,b)=>a.km-b.km).slice(0,10);
    statusEl.textContent=`近い順に10店舗を表示しています（全${stations.length}地点）`;
    list.innerHTML=nearest.map((s,i)=>`
      <article class="card">
        <div class="rank">#${i+1}　直線距離 ${fmt(s.km)}</div>
        <div class="name">${esc(s.name)}</div>
        <div class="actions">
          <a class="route" target="_blank" rel="noopener" href="${mapsRoute(s.lat,s.lng)}">🚗 経路を見る</a>
          <a class="map" target="_blank" rel="noopener" href="${mapsPoint(s.name,s.lat,s.lng)}">地図で確認</a>
        </div>
      </article>`).join('');
    btn.disabled=false;
  },err=>{
    const msg={1:'位置情報の利用が許可されませんでした。ブラウザの設定をご確認ください。',2:'現在地を取得できませんでした。',3:'位置情報の取得がタイムアウトしました。'}[err.code]||'位置情報を取得できませんでした。';
    statusEl.textContent=msg; btn.disabled=false;
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
};
</script>
</body>
</html>
